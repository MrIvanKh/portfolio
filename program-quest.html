function sx(x){return Math.round(x-cam);}
function drawHero(){var p=P;if(p.inv>0&&Math.floor(t*20)%2)return;var fr=!p.og?'jump':Math.abs(p.vx)>20?(Math.floor(p.anim)%2?'r1':'r2'):'idle';var img=HERO[fr][p.face];var w=12*p.sx,h=16*p.sy;ctx.drawImage(img,Math.round(sx(p.x+4)-w/2),Math.round(p.y+p.h+OY-h),Math.round(w),Math.round(h));}
function drawEnemy(e){var x=sx(e.x),y=Math.round(e.y+OY);if(!e.alive){if(e.sq>0){ctx.globalAlpha=e.sq/.4;px(x,y+e.h-3,e.w,3,e.e==='suit'?'#2E4374':'#FFFDF8');ctx.globalAlpha=1;}return;}var f=Math.floor(t*6)%2;
 if(e.e==='paper'){ctx.drawImage(PAPER[f],x,y);}
 else if(e.e==='sync'){px(x+1,y,12,9,'#151412');px(x,y+1,14,7,'#151412');px(x+2,y+1,10,7,'#FFFDF8');px(x+1,y+2,12,5,'#FFFDF8');px(x+3,y+4,2,2,'#151412');px(x+6,y+4,2,2,'#151412');px(x+9,y+4,2,2,'#151412');px(x+3,y+9,2,1,'#151412');px(x+3+(f?1:0),y+10,2,2,'#151412');px(x+9-(f?1:0),y+10,2,2,'#151412');}
 else{px(x+2,y,6,2,'#2B1E1A');px(x+2,y+2,6,4,'#EAB48E');px(x+3+(e.vx>0?2:0),y+3,1,1,'#151412');px(x+1,y+6,8,6,'#2E4374');px(x+4,y+6,2,4,'#E5432D');px(x+2+(f?1:0),y+12,2,2,'#151412');px(x+6-(f?1:0),y+12,2,2,'#151412');px(e.vx>0?x+9:x-3,y+8,4,4,'#6B4420');}}
function drawWorld(){var th=L.th;sky(th);if(!th.dark)clouds(cam,'rgba(255,255,255,.7)');else for(var i=0;i<40;i++)px(((i*53-cam*.05)%VW+VW)%VW,(i*29)%90,1,1,'#FFF4D6');
 landmark(th,cam);skyline(cam,.2,th.far,40,80,3,th.dark?'#3A3A60':null);skyline(cam,.45,th.near,20,52,9,th.dark?'#4A4470':null);
 drawTiles();
 L.checks.forEach(function(c){var x=sx(c.x),y=c.y+OY;px(x+3,y,2,24,'#151412');px(x+5,y,8,6,c.on?'#7CC77C':'#B9B2A5');});
 L.tapes.forEach(function(q){var x=sx(q.x),y=q.y+OY;for(var i=0;i<7;i++)px(x+i*2,y+2,2,4,i%2?'#FFFDF8':'#E5432D');px(x,y,1,8,'#151412');px(x+13,y,1,8,'#151412');});
 L.springs.forEach(function(s){var x=sx(s.x),y=s.y+OY,k=Math.round(Math.max(0,s.k)*4);px(x,y+k,12,3,'#E5432D');px(x+2,y+3+k,8,1,'#151412');px(x+4,y+5,4,1,'#151412');px(x,y+7,12,1,'#151412');});
 L.movers.forEach(function(m){var x=sx(m.x),y=Math.round(m.y+OY);px(x,y,m.w,6,th.plat);px(x,y,m.w,1,'rgba(255,255,255,.45)');px(x,y+6,m.w,1,'rgba(0,0,0,.3)');for(var i=4;i<m.w;i+=8)px(x+i,y+2,2,2,'#151412');});
 L.lamps.forEach(function(q){var x=sx(q.x),y=q.y+OY;px(x+2,y+8,2,22,'#151412');px(x,y+2,6,6,q.lit?'#FFE7A8':'#4A4A5E');px(x-1,y,8,2,'#151412');});
 L.coins.forEach(function(c){if(c.got)return;var w=Math.max(1,Math.round(Math.abs(Math.cos(t*4+c.x*.1))*6)),x=sx(c.x)+4-Math.round(w/2),y=c.y+OY+Math.round(Math.sin(t*3+c.x)*1.5);px(x,y,w,8,'#C9950F');if(w>2)px(x+1,y+1,w-2,6,'#FFC93C');});
 L.tokens.forEach(function(q){ctx.drawImage(TOKEN,sx(q.x),q.y+OY+Math.round(Math.sin(t*3+q.x)*2));});
 L.hid.forEach(function(h){if(h.got)return;ctx.drawImage(h.k==='coffee'?COFFEE:BELL,sx(h.x),h.y+OY+Math.round(Math.sin(t*2.5)*1));});
 L.miles.forEach(function(m){if(m.got)return;var y=m.y+OY+Math.round(Math.sin(t*3)*2);ctx.globalAlpha=.25+.2*Math.sin(t*5);px(sx(m.x)-2,y-2,15,15,'#FFF4D6');ctx.globalAlpha=1;ctx.drawImage(STAR,sx(m.x),y);});
 if(L.gate){var g=L.gate,gx=sx(g.x),hh=R*T-Math.round(g.open*R*T);for(var yy=0;yy<hh;yy+=4){px(gx+1,OY+yy,14,4,'#3A3346');px(gx+3,OY+yy,2,4,'#8C98A4');px(gx+7,OY+yy,2,4,'#8C98A4');px(gx+11,OY+yy,2,4,'#8C98A4');}if(hh>0)px(gx,OY+hh-3,16,3,'#151412');}
 if(L.flag){var f=L.flag,fx=sx(f.x),fy=f.y+OY,wv=Math.round(Math.sin(t*6)*1.5);px(fx,fy,2,64,'#151412');px(fx+2,fy+2+wv,16,10,'#E5432D');px(fx+2,fy+2+wv,16,2,'#FF7A5E');px(fx-2,fy-3,6,4,'#FFC93C');}
 L.enemies.forEach(drawEnemy);
 notes.forEach(function(n){var x=sx(n.x),y=Math.round(n.y+OY);px(x,y,8,8,n.c);px(x+5,y+5,3,3,'rgba(0,0,0,.25)');px(x,y,8,1,'rgba(255,255,255,.5)');});
 drawHero();
 parts.forEach(function(q){px(sx(q.x),q.y+OY,q.coin?3:2,q.coin?3:2,q.c);});
 if(th.dark)darkness();
 if(popT>0){ctx.font='8px "Press Start 2P",monospace';ctx.textAlign='center';var py=52-Math.round((1.6-popT)*8);ctx.fillStyle='#151412';ctx.fillText(popS,VW/2+1,py+1);ctx.fillStyle='#FFC93C';ctx.fillText(popS,VW/2,py);}
 if(flash>0){ctx.globalAlpha=Math.min(1,flash);px(0,0,VW,VH,'#FFF4D6');ctx.globalAlpha=1;}}
var mask=document.createElement('canvas');mask.width=VW;mask.height=VH;var mx=mask.getContext('2d');
function hole(x,y,r){var g=mx.createRadialGradient(x,y,r*.35,x,y,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');mx.fillStyle=g;mx.beginPath();mx.arc(x,y,r,0,7);mx.fill();}
function darkness(){mx.globalCompositeOperation='source-over';mx.clearRect(0,0,VW,VH);mx.fillStyle='rgba(6,6,16,.88)';mx.fillRect(0,0,VW,VH);mx.globalCompositeOperation='destination-out';hole(sx(P.x+4),P.y+OY+6,56);
 L.lamps.forEach(function(q){hole(sx(q.x+3),q.y+OY+5,q.lit?72:12);});L.miles.forEach(function(m){if(!m.got)hole(sx(m.x+6),m.y+OY+6,14);});L.coins.forEach(function(c){if(!c.got)hole(sx(c.x+4),c.y+OY+4,6);});
 L.enemies.forEach(function(e){if(e.alive)hole(sx(e.x+e.w/2),e.y+OY+4,10);});if(L.flag)hole(sx(L.flag.x),L.flag.y+OY+10,20);ctx.drawImage(mask,0,0);}

/* ---------------- title & map ---------------- */
function drawTitle(){sky({sky:['#151A33','#4A3A5C']});for(var i=0;i<50;i++)px((i*71)%VW,(i*37)%100,1,1,i%5?'#FFF4D6':'#FFC93C');landmark({far:'#2A2A48',lm:'warsaw'},-80);skyline(t*20,.4,'#22223A',30,70,5,'#5A5070');px(0,VH-24,VW,24,'#1A1A2A');px(0,VH-24,VW,2,'#3A3346');
 ctx.drawImage(HERO[Math.floor(t*6)%2?'r1':'r2'][0],VW/2-6,VH-40);}
var MAPX=[36,98,160,222,284];
function drawMap(){var th=TH[mapSel];sky(th);clouds(t*30,'rgba(255,255,255,.6)');landmark(th,0);skyline(0,0,th.far,30,60,2);px(0,VH-40,VW,40,th.top);px(0,VH-36,VW,36,th.dirt);
 var py=VH-62;for(var x=MAPX[0];x<MAPX[4];x+=6)px(x,py+4,3,2,'#FFF4D6');
 ctx.font='8px "Press Start 2P",monospace';ctx.textAlign='center';
 MAPX.forEach(function(x,i){var un=i===0||progress[i-1],done=progress[i];px(x-9,py-5,18,18,'#151412');px(x-8,py-4,16,16,done?'#FFC93C':un?TH[i].top:'#6E6A72');ctx.fillStyle='#151412';ctx.fillText(done?'*':un?String(i+1):'x',x+1,py+8);
  if(i===mapSel)ctx.drawImage(HERO.idle[0],x-6,py-24-Math.round(Math.abs(Math.sin(t*5))*3));});
 ctx.fillStyle='#151412';ctx.fillText('SELECT A WORLD',VW/2+1,23);ctx.fillStyle='#FFF4D6';ctx.fillText('SELECT A WORLD',VW/2,22);}
function mapInfo(){var w=WORLDS[mapSel],un=mapSel===0||progress[mapSel-1];$('mt').textContent=w.name;$('ms').textContent=un?(w.years+' · '+(w.org==='Deloitte'?'Deloitte, placed at Google Cloud Marketing':w.place)):'LOCKED · finish world '+mapSel+' first';$('mplay').style.visibility=un?'visible':'hidden';$('mapi').classList.add('on');}
function toMap(){state='map';L=null;hud.classList.remove('on');mapInfo();stopMusic();if(soundOn)startMusic(0);}
var mcd=0;
function updMap(dt){mcd-=dt;if(mcd<=0){if(K.r&&mapSel<4){mapSel++;mcd=.22;S.blip();mapInfo();}else if(K.l&&mapSel>0){mapSel--;mcd=.22;S.blip();mapInfo();}}if(conf||jp){conf=false;jp=false;tryPlay();}}
function tryPlay(){if(mapSel===0||progress[mapSel-1]){$('mapi').classList.remove('on');enter(mapSel);}}
$('mplay').addEventListener('click',function(e){e.stopPropagation();tryPlay();});
cv.addEventListener('pointerdown',function(e){if(state==='map'){var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW,best=0,bd=1e9;MAPX.forEach(function(m,i){var d=Math.abs(m-x);if(d<bd){bd=d;best=i;}});if(bd<30){if(best===mapSel)tryPlay();else{mapSel=best;S.blip();mapInfo();}}}else if(state==='talk')conf=true;});
$('start').addEventListener('click',function(){$('title').classList.remove('on');RUN={coins:0,t0:performance.now(),secrets:{}};S.star();toMap();});
function showClear(){var w=WORLDS[L.wi];if(L.gotC)RUN.secrets['c'+L.wi]=1;if(L.gotB)RUN.secrets['b'+L.wi]=1;progress[L.wi]=true;$('clh').textContent='WORLD '+(L.wi+1)+' CLEAR!';$('clt').textContent=w.outro;
 $('cls').textContent='● '+L.coinsGot+' coins · ☕ '+(L.gotC?'found':'missed')+' · 🏋 '+(L.gotB?'found':'missed');$('clear').classList.add('on');hud.classList.remove('on');}
$('clb').addEventListener('click',function(){$('clear').classList.remove('on');var wi=L.wi;if(progress.every(Boolean))showFinal();else{mapSel=Math.min(4,wi+1);toMap();}});
function fmt(s){s=Math.round(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
function showFinal(){state='final';L=null;var c=0,b=0;for(var k in RUN.secrets){if(k[0]==='c')c++;else b++;}
 $('fst').innerHTML='<div>TIME<b>'+fmt((performance.now()-RUN.t0)/1000)+'</b></div><div>COINS<b>'+RUN.coins+'</b></div><div>☕<b>'+c+'/5</b></div><div>🏋<b>'+b+'/5</b></div>';
 $('fact').textContent='8 years · 15 true stories · 300+ people on OKRs · LATAM alone projected to save 1,000+ hours a year';$('final').classList.add('on');S.flag();}
$('again').addEventListener('click',function(){$('final').classList.remove('on');progress=[false,false,false,false,false];mapSel=0;RUN={coins:0,t0:performance.now(),secrets:{}};toMap();});

/* ---------------- loop ---------------- */
var acc=0;
function frame(now){var dt=Math.min(.1,(now-lt)/1000||0);lt=now;t+=dt;
 if(state==='title'){if(conf){conf=false;$('start').click();}drawTitle();}
 else if(state==='map'){updMap(dt);drawMap();}
 else if(state==='final'){drawTitle();}
 else if(L){if(state==='play'){acc+=dt;while(acc>=DT){step();acc-=DT;if(state!=='play')break;}}else acc=0;
  if(state==='talk'&&dlg)updTalk(dt);
  if(state==='clear'){clearT+=dt;if(clearT>1.3&&!$('clear').classList.contains('on'))showClear();}
  parts.forEach(function(q){q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;});parts=parts.filter(function(q){return q.l>0;});
  if(popT>0)popT-=dt;if(flash>0)flash-=dt;
  ctx.save();if(shake>0){ctx.translate(Math.round(rnd(-shake,shake)),Math.round(rnd(-shake,shake)));shake=Math.max(0,shake-dt*20);}drawWorld();ctx.restore();
  if(state==='play')$('ht').textContent=fmt((now-RUN.t0)/1000);}
 if(state==='play')conf=false;
 requestAnimationFrame(frame);}
if(/[?&]debug/.test(location.search))window.__PQ={state:function(){return state;},L:function(){return L;},P:function(){return P;},K:K,enter:enter,
 tick:function(n){for(var i=0;i<n;i++){if(state==='play')step();else if(state==='talk'&&dlg){conf=true;updTalk(1);}else break;}return state;},jump:function(){jp=true;},draw:function(){if(L)drawWorld();},setProgress:function(a){progress=a;},showFinal:showFinal};
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
